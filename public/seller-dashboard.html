<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - UnNiYam</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-container { max-width: 1000px; margin: 2rem auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .product-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; background: #f8f9fa; padding: 20px; border-radius: 8px; }
        .full-width { grid-column: 1 / -1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #4361ee; color: white; }
        
        /* FORCE IMAGES TO SHOW AS PICTURES */
        .product-thumb { 
            width: 60px !important; 
            height: 60px !important; 
            object-fit: cover; 
            border-radius: 4px; 
            border: 1px solid #ccc;
            display: inline-block;
            margin-right: 5px;
        }

        .action-btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; color: white; margin-right: 5px; }
        .edit-btn { background: #f72585; }
        .delete-btn { background: #d90429; }

        /* PREVIEW BOX STYLES */
        .image-preview-container { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .preview-box { width: 80px; height: 80px; border: 1px solid #ddd; border-radius: 5px; overflow: hidden; position: relative; background: #fff; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .remove-img-btn {
            position: absolute; top: 0; right: 0;
            background: rgba(217, 4, 41, 0.9); color: white;
            border: none; cursor: pointer;
            width: 20px; height: 20px; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background-color: white; padding: 20px; border-radius: 10px; width: 600px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .close { float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo"><div class="logo-icon"></div> UnNiYam Seller</a>
            <div class="nav-links">
                <a href="index.html" style="text-decoration: none; color: #333; font-weight: bold; margin-right: 15px;">🏠 Return to Shop</a>
                <a href="#" onclick="logout()" style="color: #d90429; text-decoration: none;">Logout</a>
            </div>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2>Product Management</h2>
            <span>Welcome, <b id="seller-name">Seller</b></span>
        </div>

        <h3>Add New Product</h3>
        <form id="add-product-form" class="product-form" enctype="multipart/form-data">
            <input type="hidden" id="seller_id" name="seller_id" value=""> 
            
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category_id" id="add_category" required>
                    <option value="">Loading categories...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (฿)</label>
                <input type="number" name="price" required>
            </div>
            <div class="form-group">
                <label>Stock quantity to be added</label>
                <input type="number" name="stock" required>
            </div>
            <div class="form-group full-width">
                <label>Description</label>
                <input type="text" name="description" required>
            </div>
            <div class="form-group full-width">
                <label>Product Images (Select multiple)</label>
                <input type="file" id="add-image-input" name="product_images" accept="image/*" multiple required>
                <div class="image-preview-container" id="add-image-preview"></div>
            </div>
            <div class="form-group full-width">
                <button type="submit" class="submit-btn">Add Product</button>
            </div>
        </form>

        <h3>Your Products</h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 200px;">Images</th> <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
        </table>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h3>Edit Product</h3>
            <form id="edit-product-form" enctype="multipart/form-data">
                <input type="hidden" id="edit_product_id">
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="form-group"><label>Name</label><input type="text" id="edit_name" required></div>
                    <div class="form-group"><label>Price</label><input type="number" id="edit_price" required></div>
                    <div class="form-group"><label>Stock</label><input type="number" id="edit_stock" required></div>
                    <div class="form-group"><label>Category</label>
                        <select id="edit_category">
                            <option value="">Loading categories...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Description</label><input type="text" id="edit_desc" required></div>
                
                <div class="form-group">
                    <label>Current Images (Click X to delete)</label>
                    <div class="image-preview-container" id="edit-current-images"></div>
                </div>

                <div class="form-group">
                    <label>Add New Images</label>
                    <input type="file" id="edit-new-image-input" name="product_images" accept="image/*" multiple>
                    <div class="image-preview-container" id="edit-new-image-preview"></div>
                </div>

                <div style="margin-top:15px; text-align:right;">
                    <button type="submit" class="submit-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="seller.js"></script>
</body>
</html>
